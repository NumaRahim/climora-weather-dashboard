<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Forecast – A premium weather app showing real-time conditions, daily forecasts, and air quality data with stunning visuals."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./CSS/style.css" />
    <script src="./Js/script.js" defer></script>
    <title>Climora – Premium Weather</title>
  </head>
  <body>
    <!-- Background -->
    <div class="bg-wrap">
      <div class="bg-overlay"></div>
      <div class="bg-vignette"></div>
    </div>
    <header class="topbar">
      <div class="topbar-brand">
        <span class="icon">🌤️</span>
        <span>Climora</span>
      </div>

      <div class="search-bar" id="search-bar">
        <span class="search-icon">🔍</span>
        <input
          type="text"
          id="search-input"
          placeholder="Search city…"
          aria-label="Search city"
        />
      </div>

      <div class="topbar-actions">
        <button id="btn-refresh" title="Refresh" aria-label="Refresh">↻</button>
        <button id="btn-unit" title="Toggle unit" aria-label="Toggle unit">
          °F
        </button>
      </div>
    </header>

    <div class="app">
      <!-- ── Hero ───────────────────────────────────────────────────── -->
      <main>
        <section class="hero" aria-label="Current weather">
          <h4 id="validationError"></h4>
          <h1 class="city-name" id="city-name"></h1>
          <p class="city-subtitle" id="city-subtitle">&nbsp;</p>
          <h3 class="localTime" id="localTime"></h3>

          <div id="condition-container">
            <img id="condition-icon" alt="Weather Icon" hidden />
            <span id="condition-text"></span>
          </div>

          <div class="temperature" id="temperature"></div>
        </section>

        <!-- ── Stats Pills ──────────────────────────────────────────── -->
        <div class="stats-row" aria-label="Weather statistics">
          <div class="stat-pill">
            <span class="pill-icon">💨</span>
            <span id="pill-aqi">Air Quality: –</span>
          </div>
          <div class="stat-pill">
            <span class="pill-icon">🌡️</span>
            <span id="pill-feelslike">Feels Like –</span>
          </div>
          <div class="stat-pill">
            <span class="pill-icon">💧</span>
            <span id="pill-humidity">Humidity –</span>
          </div>
          <div class="stat-pill">
            <span class="pill-icon">🔼</span>
            <span id="pill-high">High –</span>
          </div>
          <div class="stat-pill">
            <span class="pill-icon">🔽</span>
            <span id="pill-low">Low –</span>
          </div>
          <div class="stat-pill">
            <span class="pill-icon">🌬️</span>
            <span id="pill-wind">Wind –</span>
          </div>
          <div class="stat-pill">
            <span class="pill-icon">👁️</span>
            <span id="pill-visibility">Visibility –</span>
          </div>
          <div class="stat-pill">
            <span class="pill-icon">📊</span>
            <span id="pill-pressure">Pressure –</span>
          </div>
        </div>

        <!-- ── Daily Section ────────────────────────────────────────── -->
        <div class="section-divider">
          <span class="section-label">Daily Forecast</span>
        </div>

        <!-- Forecast cards are dynamically generated by JS -->
        <!-- <div

              <div class="detail-sub" id="detail-wind-dir">Direction: –</div>
            </div>
          </div> -->

        <!-- Sunrise / Sunset -->
        <!-- <div class="detail-card sun-arc-card">
            <div class="detail-icon-wrap">☀️</div>

        <!-- Air Quality -->
        <!-- <div class="detail-card">
            <div class="detail-icon-wrap">🌿</div>
            <div class="detail-info">
              <div class="detail-label">Air Quality</div>

        <!-- ── Error Toast ───────────────────────────────────────────── -->
        <div
          id="error-toast"
          class="error-toast"
          role="alert"
          aria-live="polite"
        ></div>
      </main>
      <div class="dashboard">
        <!-- Top row -->
        <div class="stat-row">
          <div class="card stat-card">
            <svg viewBox="0 0 24 24">
              <path
                d="M12 2c-3.5 5-7 9.2-7 13a7 7 0 0 0 14 0c0-3.8-3.5-8-7-13z"
              />
            </svg>
            <p class="stat-value" id="Humidity"></p>
            <div class="stat-label">Humidity</div>
          </div>

          <div class="card stat-card">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="0">
              <path
                d="M6 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm12 0a4 4 0 1 0 0 8 4 4 0 0 0 0-8zM8 10h8M9 8l1-3h4l1 3"
                fill="none"
                stroke="#ffffff"
                stroke-width="1.6"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            <p class="stat-value" id="Visibility"></p>
            <div class="stat-label">Visibility</div>
          </div>

          <div class="card stat-card">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="#ffffff"
              stroke-width="1.6"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <!-- Globe circle -->
              <circle cx="12" cy="12" r="9" />

              <!-- Latitude horizontal curves -->
              <path d="M5 9c4 2 10 2 14 0" />
              <path d="M5 15c4-2 10-2 14 0" />

              <!-- Center latitude line -->
              <line x1="3" y1="12" x2="21" y2="12" />
            </svg>
            <p class="stat-value" id="Latitude"></p>
            <div class="stat-label">Latitude</div>
          </div>

          <div class="card stat-card">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="#ffffff"
              stroke-width="1.6"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <!-- Globe circle -->
              <circle cx="12" cy="12" r="9" />

              <!-- Longitude vertical lines -->
              <path d="M12 3c3 3 4.5 6 4.5 9s-1.5 6-4.5 9" />
              <path d="M12 3c-3 3-4.5 6-4.5 9s1.5 6 4.5 9" />

              <!-- Latitude line -->
              <line x1="3" y1="12" x2="21" y2="12" />
            </svg>
            <div class="stat-value" id="Longitude"></div>
            <div class="stat-label">Longitude</div>
          </div>
        </div>

        <!-- Bottom row -->
        <div class="bottom-row">
          <div class="left-column">
            <div class="card daylength-card">
              <svg
                width="60"
                viewBox="0 0 24 24"
                fill="none"
                stroke="#ffffff"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M14 14.76V5a2 2 0 0 0-4 0v9.76a4 4 0 1 0 4 0z" />
                <line x1="12" y1="11" x2="12" y2="17" />
                <circle cx="12" cy="18" r="1.5" fill="#ffffff" stroke="none" />
              </svg>
              <p class="stat-value" id="feelsLike"></p>
              <div class="stat-label">Feels Like</div>
            </div>

            <div class="card aq-card">
              <div class="aq-grid-top">
                <div class="aq-pill">
                  <div class="value" id="C0"></div>
                  <div class="label">CO</div>
                </div>
                <div class="aq-pill">
                  <div class="value" id="NO"></div>
                  <div class="label">NO<sub>2</sub></div>
                </div>

                <div class="aq-pill">
                  <div class="value" id="O3"></div>
                  <div class="label">O<sub>3</sub></div>
                </div>
                <div class="aq-pill">
                  <div class="value" id="SO2"></div>
                  <div class="label">SO<sub>2</sub></div>
                </div>
              </div>

              <div class="aq-grid-bottom">
                <div class="aq-pill">
                  <div class="value" id="PM2"></div>
                  <div class="label">PM<sub>2</sub></div>
                </div>
                <div class="aq-pill">
                  <div class="value" id="PM10"></div>
                  <div class="label">PM<sub>10</sub></div>
                </div>
                <div class="aq-pill">
                  <div class="value" id="s-epa-index"></div>
                  <div class="label">s-epa-index</div>
                </div>
              </div>
            </div>
          </div>

          <div class="card wind-card">
            <div class="wind-gauge">
              <svg viewBox="0 0 200 200">
                <circle
                  cx="100"
                  cy="100"
                  r="86"
                  fill="none"
                  stroke="#ffffff"
                  stroke-width="7"
                />
                <polygon points="178,44 195,52 182,64" fill="#ffffff" />
              </svg>
            </div>
            <div class="wind-speed" id="windSpeed"></div>
            <div class="wind-label">
              <svg
                viewBox="0 0 24 24"
                stroke-width="1.6"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M3 8h13a2.5 2.5 0 1 0-2.5-2.5" />
                <path d="M3 16h17a2.5 2.5 0 1 1-2.5 2.5" />
                <path d="M3 12h9" />
              </svg>
              Wind Speed
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
